<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meus objetivos do ano</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section class="conteudo-principal">
    <h2 class="titulo-principal">Meus Objetivos do ano<span>_</span></h2>
    <div class="botoes">
      <button class="botao">Fazer mais cursos</button>
      <button class="botao">Ir bem no ENEM</button>
      <button class="botao">Finalizar o Ensino Médio</button>
      <button class="botao">Atualizar meu currículo</button>
    </div>
    <div class="conteudo">
      <div class="abas-textos">
        <div class="aba-conteudo">
          <h3 class="aba-conteudo-titulo-principal">Fazer mais cursos</h3>
          <h4 class="aba-conteudo-titulo-secundario">
            Fazer cursos básicos para complementar o currículo
          </h4>
        </div>
        <div class="aba-conteudo">
          <h3 class="aba-conteudo-titulo-principal">
            Ir bem no ENEM
          </h3>
          <h4 class="aba-conteudo-titulo-secundario">
            Estudar e se dedicar na prova
          </h4>
        </div>
        <div class="aba-conteudo">
          <h3 class="aba-conteudo-titulo-principal">
            Finalizar o Ensino médio
          </h3>
          <h4 class="aba-conteudo-titulo-secundario">
            Tirar notas altas e ter uma boa frequência
          </h4>
        </div>
        <div class="aba-conteudo">
          <h3 class="aba-conteudo-titulo-principal">
            Atualizar meu currículo
          </h3>
          <h4 class="aba-conteudo-titulo-secundario">
            Incluir mais cursos e colocar dados recentes
          </h4>
        </div>
      </div>
    </div>
  </section>
  <script src="main.js"></script>
</body>

</html>
